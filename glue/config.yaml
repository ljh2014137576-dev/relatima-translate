asr:
  provider: "openai"           # openai (OpenRouter whisper) | wlk (legacy local, not recommended)
  openrouter_api_key: ""       # or env OPENROUTER_API_KEY
  model: "openai/whisper-large-v3"
  base_url: "https://openrouter.ai/api/v1"
  chunk_seconds: 8             # transcribe this much NEW audio per call
  overlap_seconds: 4           # include this much past audio for context
  timeout: 60

wlk:
  url: "ws://127.0.0.1:8000/asr?target_language=zh"
  min_text_len: 2
  debounce_seconds: 1.0   # how long a tail sentence must be stable before translation
  force_len: 60           # force-flush a line once its text grows this long

llm:
  enabled: true           # true: translate ASR source text via DeepSeek (replaces NLLB)
  api_key: ""             # leave empty to use env var DEEPSEEK_API_KEY (recommended)
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  max_batch: 4            # sentences per API call
  batch_window: 0.4       # seconds to wait for more sentences before flushing a batch
  timeout: 30
  glossary: []            # e.g. [{"from": "RTX", "to": "RTX"}]
  web_search:
    enabled: true         # verify proper nouns/terms via web search before translating
    api_key: ""           # or env TAVILY_API_KEY
    max_results: 2        # search results per term
    search_depth: "basic" # basic | advanced
    max_context_chars: 300
    timeout: 20

tts:
  provider: "minimax"      # local | minimax | elevenlabs | edge
  url: "http://127.0.0.1:50001/tts"     # only for provider=local
  ref_audio: "refs/default.wav"         # reference voice (used for cloning)
  max_text_len: 80
  timeout: 1800
  minimax:
    api_key: ""            # or env MINIMAX_API_KEY
    group_id: ""           # or env MINIMAX_GROUP_ID (required by MiniMax)
    model: "speech-02-turbo"
    voice_id: "rt_relatima_v1"  # optional; if empty, auto-clone from ref_audio on first use
    timeout: 60
  elevenlabs:
    api_key: ""            # or env ELEVENLABS_API_KEY
    voice_id: ""
    model: "eleven_multilingual_v2"
    timeout: 60
  edge:
    voice: "zh-CN-YunxiNeural"

playback:
  sample_rate: 22050
  device: null          # null = system default output device
  sentence_gap: 0.4     # seconds of silence inserted between sentences
  queue_seconds: 1.0    # delay knob: keep each sentence this far behind its ready time

relay:
  host: "127.0.0.1"
  port: 5100
